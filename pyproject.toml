[project]
name = "python-playwright-automation"
version = "0.1.0"
description = "Python test automation framework using Playwright"
requires-python = ">=3.12"
dependencies = [
    "pytest",
    "playwright",
    "pytest-playwright",
    "allure-pytest",
    "requests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s | %(levelname)s | %(message)s"